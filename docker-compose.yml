---
services:
 checkmk:
  image: checkmk/check-mk-raw:2.4.0-2026.01.31
  container_name: ${container_name}
  environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - TZ=${TZ}
    - CMK_PASSWORD=${CMK_PASSWORD}
    - CMK_SITE_ID=db
    - CMK_LIVESTATUS_TCP=on
  ports:
    - ${IP}:${ext_httpport}:${int_httpport}
    - ${IP}:${ext_httpsport}:${int_httpsport}
    - ${IP}:${ext_man1port}:${int_man1port}
    - ${IP}:${ext_man2port}:${ext_man2port}
  tmpfs:
    - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
  volumes:
    - sites:/omd/sites
    - mibs:/omd/sites/cmk/local/share/check_mk/mibs
    - backups:/omd/backups
    - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
  restart: unless-stopped
  healthcheck:
    # `omd status` exits non-zero when OPTIONAL site services are stopped
    # (stunnel only matters for SSL sites; automation-helper is not part of
    # the core check set). Checking only the services that must be running
    # for a working instance avoids a permanently unhealthy container.
    test:
      - CMD-SHELL
      - >-
        omd status | grep -qE 'apache: *running' &&
        omd status | grep -qE 'nagios: *running' &&
        omd status | grep -qE 'agent-receiver: *running'
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s

volumes:
  sites:
  mibs:
  backups: